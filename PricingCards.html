<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pricing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">

    <h1 class="text-center mb-5">Pricing Plans</h1>

    <div class="row">

        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-header">Basic</div>
                <div class="card-body">
                    <h2>$9</h2>
                    <p>1 User</p>
                    <p>10GB Storage</p>
                    <button class="btn btn-outline-primary">
                        Choose
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center border-primary">
                <div class="card-header bg-primary text-white">
                    Pro
                </div>
                <div class="card-body">
                    <h2>$29</h2>
                    <p>10 Users</p>
                    <p>100GB Storage</p>
                    <button class="btn btn-primary">
                        Choose
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-header">Enterprise</div>
                <div class="card-body">
                    <h2>$99</h2>
                    <p>Unlimited Users</p>
                    <p>1TB Storage</p>
                    <button class="btn btn-outline-primary">
                        Choose
                    </button>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
